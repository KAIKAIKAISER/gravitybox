name: Release (Windows)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v1.1.4). Defaults to package.json version if empty.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-win-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build & Publish Windows Release
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Cache Rust Build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            native-win/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('native-win/Cargo.toml', 'native-win/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Resolve Release Tag
        id: meta
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $version = $pkg.version
          $tag = "${{ inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            if ("${{ github.ref_type }}" -eq "tag") {
              $tag = "${{ github.ref_name }}"
            } else {
              $tag = "v$version"
            }
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Invalid tag format: $tag (expected vX.Y.Z)"
          }
          if ($tag.Substring(1) -ne $version) {
            throw "Tag $tag does not match package.json version $version"
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install Dependencies
        run: npm ci

      - name: Build TypeScript & Runtime
        run: npm run build

      - name: Privacy Gate
        run: node tools/check-privacy.mjs

      - name: Ensure NSIS (makensis)
        shell: pwsh
        run: |
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) {
            choco install nsis -y --no-progress
          }

      - name: Build Windows Installer & Portable ZIP
        run: node tools/package-win.mjs --skip-build

      - name: Publish GitHub Release
        shell: pwsh
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $ver = "${{ steps.meta.outputs.version }}"
          $exe = "成品/GravityBox-Setup-$ver-x64.exe"
          $zip = "成品/GravityBox-$ver-win-x64.zip"
          $manifest = "成品/release-manifest.json"
          $existing = gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe "$exe.sha256" $zip "$zip.sha256" $manifest --clobber
          } else {
            gh release create $tag $exe "$exe.sha256" $zip "$zip.sha256" $manifest `
              --title "GravityBox $tag (Windows)" `
              --generate-notes `
              --target "${{ github.sha }}"
          }

      - name: Upload Artifacts Copy
        uses: actions/upload-artifact@v4
        with:
          name: gravitybox-release-${{ steps.meta.outputs.tag }}
          path: |
            成品/*.exe
            成品/*.zip
            成品/*.sha256
            成品/release-manifest.json
          retention-days: 30
